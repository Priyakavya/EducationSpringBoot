# ============================================================
#  DEFAULT PROFILE  -> MySQL 8
#  Run with:  mvn spring-boot:run
# ============================================================
spring.application.name=education-api
server.port=8080

# ---- Datasource (MySQL) -------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/education_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Priya@02
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----------------------------------------
# validate  = fail fast if the schema in sql/schema.sql does not match the entities
# update    = let Hibernate create/alter tables for you (use while developing)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- JSON ---------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- Swagger ------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ---- Actuator -----------------------------------------------
info.app.name=Student Course Management System
info.app.description=Spring Boot REST API Project
info.app.version=1.0.0

management.info.env.enabled=true
management.endpoints.web.exposure.include=*


# ---- Error handling -----------------------------------------
# Makes Spring throw NoHandlerFoundException so our GlobalExceptionHandler
# can return a clean JSON 404 instead of the default HTML whitelabel page.
# (Do NOT also set spring.web.resources.add-mappings=false - that disables the
#  static resource handlers the Swagger UI is served from.)
spring.mvc.throw-exception-if-no-handler-found=true

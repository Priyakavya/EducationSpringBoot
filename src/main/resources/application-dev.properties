# ============================================================
#  DEV PROFILE  -> H2 in-memory, no DB install needed
#  Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  H2 console: http://localhost:8080/h2-console  (JDBC URL below)
# ============================================================
spring.datasource.url=jdbc:h2:mem:education_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=root
spring.datasource.password=Priya@02
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Load demo rows on every startup so Postman has data to hit immediately
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql
spring.jpa.defer-datasource-initialization=true
